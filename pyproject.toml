[project]
name = "playworld"
version = "0.0.1"
description = "Phone video to a walkable, physical three.js world"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
playworld = "playworld.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
